<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1e" />
      <stop offset="50%" stop-color="#05070c" />
      <stop offset="100%" stop-color="#030408" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3" />

  <!-- POS Terminal Body -->
  <g transform="translate(106, 96)">
    <!-- Base stand -->
    <path d="M 60 270 L 240 270 L 260 300 L 40 300 Z" fill="#13192f" stroke="#1f2942" stroke-width="3" />
    <rect x="130" y="240" width="40" height="30" rx="4" fill="#0f1527" stroke="#1f2942" stroke-width="2" />

    <!-- Terminal Screen Frame -->
    <rect x="20" y="30" width="260" height="200" rx="20" fill="#0d1224" stroke="url(#cyanGrad)" stroke-width="5" filter="url(#glow)" />

    <!-- Screen Glass -->
    <rect x="32" y="42" width="236" height="176" rx="12" fill="#05070f" />

    <!-- Top Screen Header Bar -->
    <rect x="42" y="52" width="216" height="24" rx="6" fill="#101830" />
    <circle cx="56" cy="64" r="4" fill="#00f2fe" />
    <circle cx="70" cy="64" r="4" fill="#10b981" />
    <circle cx="84" cy="64" r="4" fill="#f59e0b" />
    <rect x="160" y="60" width="86" height="8" rx="4" fill="#1f2942" />

    <!-- Terminal Screen Receipt Ticket coming out -->
    <g transform="translate(150, -30)">
      <path d="M 0 0 L 80 0 L 80 80 L 72 74 L 64 80 L 56 74 L 48 80 L 40 74 L 32 80 L 24 74 L 16 80 L 8 74 L 0 80 Z" fill="#ffffff" />
      <line x1="12" y1="16" x2="68" y2="16" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
      <line x1="12" y1="28" x2="52" y2="28" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
      <line x1="12" y1="40" x2="68" y2="40" stroke="#059669" stroke-width="3.5" stroke-linecap="round" />
      <line x1="12" y1="52" x2="40" y2="52" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Keypad Numpad Grid on Terminal -->
    <g transform="translate(48, 92)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="24" height="20" rx="4" fill="#151d38" stroke="#00f2fe" stroke-width="1.5" />
      <rect x="32" y="0" width="24" height="20" rx="4" fill="#151d38" stroke="#1f2942" stroke-width="1" />
      <rect x="64" y="0" width="24" height="20" rx="4" fill="#151d38" stroke="#1f2942" stroke-width="1" />

      <!-- Row 2 -->
      <rect x="0" y="28" width="24" height="20" rx="4" fill="#151d38" stroke="#1f2942" stroke-width="1" />
      <rect x="32" y="28" width="24" height="20" rx="4" fill="#151d38" stroke="#00f2fe" stroke-width="1.5" />
      <rect x="64" y="28" width="24" height="20" rx="4" fill="#151d38" stroke="#1f2942" stroke-width="1" />

      <!-- Row 3 -->
      <rect x="0" y="56" width="24" height="20" rx="4" fill="#151d38" stroke="#1f2942" stroke-width="1" />
      <rect x="32" y="56" width="24" height="20" rx="4" fill="#151d38" stroke="#1f2942" stroke-width="1" />
      <rect x="64" y="56" width="24" height="20" rx="4" fill="#151d38" stroke="#00f2fe" stroke-width="1.5" />

      <!-- Big Green Validate / Pay Bar -->
      <rect x="0" y="84" width="88" height="24" rx="6" fill="url(#emeraldGrad)" />
      <path d="M 36 96 L 42 102 L 54 90" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Right summary on screen -->
    <g transform="translate(150, 92)">
      <rect x="0" y="0" width="96" height="52" rx="8" fill="#101832" stroke="#1f2a48" stroke-width="1.5" />
      <text x="12" y="22" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="bold">TOTAL</text>
      <text x="12" y="42" fill="#ffffff" font-family="monospace" font-size="15" font-weight="900">25 000 F</text>

      <rect x="0" y="60" width="96" height="48" rx="8" fill="url(#goldGrad)" opacity="0.95" />
      <text x="48" y="88" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">CAISSE PRO</text>
    </g>
  </g>

  <!-- Offline Lightning Badge in corner -->
  <g transform="translate(360, 360)">
    <circle cx="28" cy="28" r="28" fill="#00f2fe" />
    <circle cx="28" cy="28" r="32" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 28 12 L 18 30 L 26 30 L 24 44 L 38 24 L 30 24 Z" fill="#05070c" />
  </g>
</svg>
